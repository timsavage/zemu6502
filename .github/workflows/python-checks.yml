name: Python CI
on:
  - push
  - workflow_dispatch

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7

      - name: Prepare UV
        uses: $/.github/actions/uv-prepare

      - name: Lint
        run: |
          uv run ruff check .

      - name: Format Check
        run: |
          uv run ruff format --check .

  unit-test:
    name: Python Unittest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7

      - name: Prepare UV
        uses: $/.github/actions/uv-prepare

      - name: Unit Test
        run: |
          mkdir -p reports
          
          uv run pytest --verbose \
            --md-report --md-report-flavor=gfm --md-report-output=reports/test-python.md \
            --cov --cov-report=markdown:reports/coverage-python.md \
            .
          
          echo "# Unit Tests\n" >> $GITHUB_STEP_SUMMARY
          cat reports/test-python.md >> $GITHUB_STEP_SUMMARY
          echo "# Coverage\n" >> $GITHUB_STEP_SUMMARY
          cat reports/coverage-python.md >> $GITHUB_STEP_SUMMARY
